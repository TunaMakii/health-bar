<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Health Bar — Theme Mockups</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(ellipse 90% 60% at 50% 0%,#241811,#0c0805 70%);color:#e9ddc0;
  font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;padding:26px 20px 50px}
h1{font-size:22px;font-weight:700;letter-spacing:1px;text-align:center;
  background:linear-gradient(180deg,#e8cf8a,#c9a64b 60%,#8a733f);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:#a4936f;font-style:italic;font-size:14px;margin:4px 0 24px}
.grid{display:flex;flex-wrap:wrap;gap:26px;justify-content:center;align-items:flex-start;max-width:1500px;margin:0 auto}
.card{width:270px}
.label{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
.label .n{width:22px;height:22px;border-radius:50%;background:linear-gradient(180deg,#e8cf8a,#8a733f);color:#1a1206;
  font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
.label .t{font-weight:700;font-size:15px;color:#efe4c3}
.label .d{font-size:12px;color:#a4936f;font-style:italic;margin-left:auto}
.wrap{width:270px;border-radius:20px;overflow:hidden;
  box-shadow:0 0 0 1px rgba(201,166,75,.35),0 18px 40px rgba(0,0,0,.6);background:#000}
.wrap img{width:100%;display:block}
.note{text-align:center;color:#7d7261;font-size:12.5px;margin-top:26px}
</style></head>
<body>
  <h1>HEALTH BAR — THEME MOCKUPS</h1>
  <div class="sub">Same battlefield state (Mei · 34 life · 18 commander · round 3) — the two kept looks</div>
  <div class="grid">
    <div class="card"><div class="label"><span class="n">1</span><span class="t">Terminal</span><span class="d">minimal · mono</span></div><div class="wrap"><img src="1-terminal.png" alt="Terminal theme"></div></div>
    <div class="card"><div class="label"><span class="n">2</span><span class="t">Tokyo Punk</span><span class="d">manga · ink</span></div><div class="wrap"><img src="2-tokyo-punk.png" alt="Tokyo Punk theme"></div></div>
  </div>
  <div class="note">Files: mockups/themes/&lt;name&gt;.html — open any one directly for a full-size, live view.</div>
</body></html>
